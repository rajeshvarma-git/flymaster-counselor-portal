services:
  postgres:
    image: postgres:16
    container_name: flymasters-postgres
    environment:
      POSTGRES_USER: flymasters
      POSTGRES_PASSWORD: flymasters
      POSTGRES_DB: flymasters
    ports:
      - "5433:5432"
    volumes:
      - flymasters_pg:/var/lib/postgresql/data

volumes:
  flymasters_pg:
